<svg role="img" xmlns="http://www.w3.org/2000/svg" width="1200" height="1056" viewBox="0 0 1000 880">
  <title>BenchRep pyramid logo — transparent dark-mode variant</title>
  <defs>
    <linearGradient id="leftStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E277F"/><stop offset="0.48" stop-color="#8451BC"/><stop offset="1" stop-color="#A781D5"/>
    </linearGradient>
    <linearGradient id="verticalStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67369F"/><stop offset="0.56" stop-color="#8D5BC5"/><stop offset="1" stop-color="#472073"/>
    </linearGradient>
    <linearGradient id="rightStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F3CAB"/><stop offset="0.54" stop-color="#9764CE"/><stop offset="1" stop-color="#4F277F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C47A07"/><stop offset="0.42" stop-color="#F3B520"/><stop offset="0.75" stop-color="#FFD765"/><stop offset="1" stop-color="#CE880B"/>
    </linearGradient>
    <linearGradient id="glossBody" gradientUnits="userSpaceOnUse" x1="470" y1="300" x2="800" y2="660">
      <stop offset="0" stop-color="#A979DD"/><stop offset="0.25" stop-color="#7E42BB"/><stop offset="0.53" stop-color="#54228A"/><stop offset="0.72" stop-color="#8B4DC0"/><stop offset="1" stop-color="#4A1978"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="550" cy="250" r="440" gradientTransform="translate(0 70) scale(1 .85)">
      <stop offset="0" stop-color="#F4E0FF" stop-opacity=".84"/><stop offset=".24" stop-color="#DCB6FF" stop-opacity=".4"/><stop offset=".68" stop-color="#B373F3" stop-opacity=".05"/><stop offset="1" stop-color="#B373F3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity=".1"/><stop offset=".42" stop-color="#FFF" stop-opacity=".47"/><stop offset="1" stop-color="#FFF" stop-opacity=".02"/>
    </linearGradient>
    <clipPath id="triangleClip"><path d="M500 140 L820 460 L500 780 Z"/></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="roundSpecular" gradientUnits="userSpaceOnUse" cx="644" cy="447" r="235">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".93"/>
      <stop offset=".12" stop-color="#FAEEFF" stop-opacity=".84"/>
      <stop offset=".28" stop-color="#EFD8FF" stop-opacity=".64"/>
      <stop offset=".51" stop-color="#E1BDF9" stop-opacity=".27"/>
      <stop offset=".78" stop-color="#D7A8F3" stop-opacity=".035"/>
      <stop offset="1" stop-color="#D7A8F3" stop-opacity="0"/>
    </radialGradient>
  
    <!-- Directional light from upper right: three distinct sloping faces. -->
    <linearGradient id="pyramidBright" gradientUnits="userSpaceOnUse" x1="540" y1="220" x2="760" y2="477">
      <stop offset="0" stop-color="#E0CCF7"/>
      <stop offset="0.46" stop-color="#CBADE8"/>
      <stop offset="1" stop-color="#AE83D7"/>
    </linearGradient>
    <linearGradient id="pyramidMiddle" gradientUnits="userSpaceOnUse" x1="800" y1="435" x2="521" y2="757">
      <stop offset="0" stop-color="#C19ADD"/>
      <stop offset="0.44" stop-color="#AD82D0"/>
      <stop offset="1" stop-color="#9464BD"/>
    </linearGradient>
    <linearGradient id="pyramidShadow" gradientUnits="userSpaceOnUse" x1="494" y1="477" x2="644" y2="438">
      <stop offset="0" stop-color="#8053AB"/>
      <stop offset="0.58" stop-color="#9369B9"/>
      <stop offset="1" stop-color="#B08ACD"/>
    </linearGradient>
    <radialGradient id="apexReflectedLight" gradientUnits="userSpaceOnUse" cx="616" cy="448" r="70">
      <stop offset="0" stop-color="#F9F0FF" stop-opacity="0.33"/>
      <stop offset="0.35" stop-color="#D4B5EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D4B5EE" stop-opacity="0"/>
    </radialGradient>

  </defs>

  
    <!-- Orthographic top view of a three-sided pyramid. -->
    <g clip-path="url(#triangleClip)">
      <path d="M500 140 L820 460 L620 452 Z" fill="url(#pyramidBright)"/>
      <path d="M820 460 L500 780 L620 452 Z" fill="url(#pyramidMiddle)"/>
      <path d="M500 780 L500 140 L620 452 Z" fill="url(#pyramidShadow)"/>
      <path d="M500 140 L820 460 L620 452 L500 140 Z" fill="url(#apexReflectedLight)"/>
      <path d="M500 140 L620 452 L820 460 M500 780 L620 452" fill="none"
            stroke="#5D3485" stroke-width="1.4" stroke-opacity="0.36" stroke-linejoin="round"/>
    </g>


  <path d="M500 140 L180 460" fill="none" stroke="#8957C2" stroke-width="27" stroke-linecap="round"/>
  <path d="M500 140 L500 780" fill="none" stroke="#8957C2" stroke-width="36" stroke-linecap="round"/>
  <path d="M500 140 L820 460" fill="none" stroke="#8957C2" stroke-width="30" stroke-linecap="round"/>
  <path d="M500 780 L820 460" fill="none" stroke="url(#gold)" stroke-width="33" stroke-linecap="round"/>

  <!-- Clean datum bar without calibration/ruler ticks. -->
  <rect x="157" y="117.25" width="687" height="22.5" rx="7.5" fill="#8957C2"/>
</svg>
