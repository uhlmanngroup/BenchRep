# ImageNet initialization, followed by contrastive fine-tuning of all parameters.
stage: training

run:
  output_root: outputs/07_learn_from_multiple_views
  run_name_prefix: stl10_pretrained

reproducibility:
  seed: 137
  seed_workers: true

dataset:
  name: stl10
  params:
    root: data/stl10
    split: unlabeled
    download: true

# Each pipeline draws its own augmentations for training and validation.
transform_pipelines:
  - input: x
    output: view_a
    steps: &view_steps
      - name: random_resized_crop
        apply_to: [training, validation]
        params:
          size: [96, 96]
          scale: [0.2, 1.0]
          ratio: [0.75, 1.3333333333333333]
      - name: random_horizontal_flip
        apply_to: [training, validation]
        params:
          p: 0.5
      - name: color_jitter
        random_apply: 0.8
        apply_to: [training, validation]
        params:
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
          hue: 0.1
      - name: random_grayscale
        apply_to: [training, validation]
        params:
          p: 0.2
      - name: gaussian_blur
        random_apply: 0.5
        apply_to: [training, validation]
        params:
          kernel_size: 7
          sigma: [0.1, 2.0]
      - name: to_dtype
        apply_to: [training, validation]
        params:
          dtype: float32
          scale: true
      - name: normalize
        apply_to: [training, validation]
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
  - input: x
    output: view_b
    steps: *view_steps

datamodule:
  batch_size: 128
  val_fraction: 0.125
  num_workers: 0
  drop_last: true

model:
  name: composite

composite_model_declarations:
  expects:
    x: sample_image
    view_a: positive_image
    view_b: positive_image
  batch_metadata:
    sample_id: index
    label: group
  produces:
    embedding_a: embedding_vector
    embedding_b: embedding_vector
    projection_a: projection_vector
    projection_b: projection_vector

composite_model_components:
  shared_encoder:
    kind: encoder
    name: torchvision_resnet
    params:
      input_shape: [3, 96, 96]
      variant: resnet18
      weights: IMAGENET1K_V1
      # Preserve the original stem in both variants.
      small_stem: false
      output_dim: 512
  shared_projector:
    kind: head
    name: mlp
    params:
      input_dim: 512
      hidden_dims: [512]
      output_dim: 128
      activation: relu
      normalization: batchnorm

composite_model_assembly:
  encode_a:
    component: shared_encoder
    inputs:
      x: expects.view_a
    outputs: produces.embedding_a
  encode_b:
    component: shared_encoder
    inputs:
      x: expects.view_b
    outputs: produces.embedding_b
  project_a:
    component: shared_projector
    inputs:
      x: produces.embedding_a
    outputs: produces.projection_a
  project_b:
    component: shared_projector
    inputs:
      x: produces.embedding_b
    outputs: produces.projection_b

losses:
  contrastive:
    - name: nt_xent
      weight: 1.0
      params:
        temperature: 0.2
      composite_wiring:
        view_a: produces.projection_a
        view_b: produces.projection_b

optimizer:
  name: adamw
  params:
    lr: 0.0003
    weight_decay: 0.0001
  lr_scheduler:
    name: cosine_annealing
    interval: epoch
    params:
      T_max: &epochs 20
      eta_min: 0.00001

trainer:
  accelerator: auto
  devices: 1
  max_epochs: *epochs
  # At batch size 128, process 16,384 training and 2,048 validation images per epoch.
  limit_train_batches: 128
  limit_val_batches: 16
  log_every_n_steps: 16
  precision: 32-true

checkpointing:
  monitor: losses/val/total_weighted_loss
  mode: min
  save_top_k: 1
  save_last: true

logger:
  name: csv
  params:
    save_dir: outputs/07_learn_from_multiple_views
    name: csv

inspection:
  torchview:
    enabled: true