stage: training

run:
  output_root: outputs/06_schedule_and_monitor_training
  run_name_prefix: mnist_vae

reproducibility:
  seed: 137
  seed_workers: true
  float32_matmul_precision: highest

dataset:
  name: mnist
  params:
    root: data/mnist
    split: train
    download: true

transform_pipelines:
  - steps:
      - name: to_dtype
        apply_to: [training, validation]
        params:
          dtype: float32
          scale: true

datamodule:
  batch_size: 128
  val_fraction: 0.1
  num_workers: 0

model:
  name: vae
  params:
    latent_dim: 16

encoder:
  name: mlp
  params:
    input_shape: [1, 28, 28]
    hidden_dims: [128]
    output_dim: 32

decoder:
  name: mlp
  params:
    output_shape: [1, 28, 28]
    hidden_dims: [128]
    output_activation: sigmoid

losses:
  reconstruction:
    - name: mse
      weight: 1.0
      params:
        reduction: mean
  regularization:
    - name: gaussian_kl
      weight: 0.001
      params:
        reduction: mean
      # The effective KL weight rises from 0.0001 to 0.001 over epochs 0–3.
      weight_schedule:
        name: linear
        interval: epoch
        params:
          start: 0
          end: 3
          start_factor: 0.1
          end_factor: 1.0

optimizer:
  name: adam
  params:
    lr: 0.001
  # Once the KL weight has settled, reduce the learning rate at epoch 5.
  lr_scheduler:
    name: multi_step
    interval: epoch
    params:
      milestones: [5]
      gamma: 0.25

inspection:
  gradient_norms:
    - kind: per_loss
      target: encoder
      losses: [reconstruction.mse, regularization.gaussian_kl]
      norm_type: l2
      every_n_batches: 1
    - kind: optimizer_gradients
      target: encoder
      norm_type: l2
      every_n_optimizer_steps: 1

trainer:
  max_epochs: 8
  accelerator: auto
  devices: 1
  precision: 32-true
  log_every_n_steps: 1

checkpointing:
  # Compare epochs using a metric whose definition is independent of the KL weight.
  monitor: losses/val/reconstruction/mse
  mode: min
  save_top_k: 1
  save_last: true

logger:
  name: csv
  params:
    save_dir: outputs/06_schedule_and_monitor_training
    name: csv
    flush_logs_every_n_steps: 10
