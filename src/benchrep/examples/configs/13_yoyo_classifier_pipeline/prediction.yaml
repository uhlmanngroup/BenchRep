stage: prediction

source:
  checkpoint: best

# The model class is supplied again through PredictionOverrides. Omitting
# overrides.model here lets its constructor params be inherited from training.
dataset:
  name: cifar10
  params:
    root: data/cifar10
    split: test
    download: true

# Inherit validation preprocessing, excluding the training-only random flip.
transform_pipelines: null

data:
  batch_size: 128
  num_workers: 0

# YOYO exports use names returned by predict_step, without declared roles.
exports:
  anndata:
    enabled: true
    mode: custom
    keys:
      - features
      - logits
    primary_key: features
  reconstructions:
    enabled: false
