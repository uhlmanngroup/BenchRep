name: CI
run-name: CI / ${{ inputs.run_usage && 'with usage examples' || 'regular tests only' }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      run_usage:
        description: Include usage examples in the test suite
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_inputs:
    name: Prepare shared usage inputs
    if: ${{ inputs.run_usage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      cache_key: ${{ steps.downloads.outputs.cache-primary-key }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Check shared input cache
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: data/
          key: usage-inputs-v3-${{ hashFiles('.github/scripts/prepare_usage_cache.py') }}
          enableCrossOsArchive: true
          lookup-only: true

      # On an inventory change, reuse available inputs before fetching additions.
      # Keep the lookup above separate: exact hits need no download in this job.
      - name: Restore inputs to extend the cache
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/
          key: ${{ steps.downloads.outputs.cache-primary-key }}
          restore-keys: |
            usage-inputs-v3-
          enableCrossOsArchive: true

      - name: Set up Python for downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install download dependencies
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          python -m pip install "torch>=2.4,<3" "torchvision>=0.19,<1" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Download and validate usage inputs
        if: steps.downloads.outputs.cache-hit != 'true'
        run: python .github/scripts/prepare_usage_cache.py --data-dir data

      - name: Save shared datasets and weights
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/
          key: ${{ steps.downloads.outputs.cache-primary-key }}
          enableCrossOsArchive: true

  tests:
    needs: prepare_inputs
    # Regular-only runs must still run when the preparation job is skipped.
    if: ${{ !cancelled() && (!inputs.run_usage || needs.prepare_inputs.result == 'success') }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - windows-2025
          - macos-15
          - macos-26
          # macOS 27 is currently provided by the Xcode 27 preview runner.
          - xcode-27
        python: ["3.12", "3.13", "3.14"]
    timeout-minutes: 90

    # Git Bash is available on the Windows runner too.
    defaults:
      run:
        shell: bash

    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      TORCH_HOME: ${{ github.workspace }}/data/torch
      BENCHREP_GUI_TRACE_DIR: ${{ github.workspace }}/outputs/ci/gui-failures
      COVERAGE_RCFILE: ${{ github.workspace }}/outputs/ci/coverage/coverage.ini

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Restore shared datasets and weights
        if: ${{ inputs.run_usage }}
        uses: actions/cache/restore@v6
        with:
          path: data/
          key: ${{ needs.prepare_inputs.outputs.cache_key }}
          enableCrossOsArchive: true
          # Fail clearly if the prepared cache disappears; do not silently
          # download the datasets again inside every test job.
          fail-on-cache-miss: true

      - name: Install Graphviz on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Graphviz and OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install graphviz libomp

      - name: Install Graphviz on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install graphviz --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $graphvizBin = Join-Path $env:ProgramFiles 'Graphviz\bin'
          if (-not (Test-Path (Join-Path $graphvizBin 'dot.exe'))) {
            throw "Graphviz executable not found in $graphvizBin"
          }
          $graphvizBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: |
          python -m pip install "torch>=2.4,<3" "torchvision>=0.19,<1" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.4,<3" "torchvision>=0.19,<1"

      - name: Install BenchRep with dev deps
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Same features as dev, except XGBoost (see docs/known-issues.md).
            python -m pip install -e ".[scverse,logging,model_graph,optuna,gui-test,artifact_generation,docs]" "coverage>=7.11,<8"
            python -c "import importlib.util; assert importlib.util.find_spec('xgboost') is None, 'XGBoost unexpectedly installed on macOS'"
          else
            python -m pip install -e ".[dev]" "coverage>=7.11,<8"
          fi
          mkdir -p outputs/ci
          python -VV > outputs/ci/environment.txt
          python -m pip list --format=freeze >> outputs/ci/environment.txt
          python -m pip check

      - name: Install Chromium for wizard tests
        run: python -m playwright install --with-deps chromium

      - name: Configure coverage
        shell: python
        run: |
          import os
          from pathlib import Path

          root = Path.cwd()
          coverage_dir = root / "outputs" / "ci" / "coverage"
          coverage_dir.mkdir(parents=True, exist_ok=True)
          Path(os.environ["COVERAGE_RCFILE"]).write_text(
              "[run]\n"
              f"source = {(root / 'src' / 'benchrep').as_posix()}\n"
              "branch = true\n"
              "parallel = true\n"
              "patch = subprocess\n"
              "concurrency = multiprocessing\n"
              f"data_file = {(coverage_dir / '.coverage').as_posix()}\n",
              encoding="utf-8",
          )

      - name: Run selected test suite
        id: tests
        # Leave time for saving downloads and uploading reports after a timeout.
        timeout-minutes: 75
        env:
          RUN_USAGE: ${{ inputs.run_usage }}
        run: |
          usage_options=()
          if [[ "$RUN_USAGE" == "true" ]]; then
            usage_options+=(
              --run-usage-examples --usage-device cpu
              --usage-timeout 3600
              --usage-data-dir "$GITHUB_WORKSPACE/data"
              --usage-output outputs/ci/usage-runs
              --no-usage-clean-on-success
            )
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              usage_options+=(--usage-skip-xgboost)
            fi
          fi
          python -m coverage run -m pytest tests/*/ \
            "${usage_options[@]}" \
            --junitxml=outputs/ci/pytest.xml \
            --durations=15 -ra -v

      - name: Generate coverage reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          python -m coverage combine --keep
          python -m coverage report --show-missing | tee outputs/ci/coverage/summary.txt
          python -m coverage json -o outputs/ci/coverage/coverage.json
          python -m coverage xml -o outputs/ci/coverage/coverage.xml
          python -m coverage html -d outputs/ci/coverage/html

      - name: Save test reports and usage logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}-usage-${{ inputs.run_usage }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            outputs/ci/environment.txt
            outputs/ci/pytest.xml
            outputs/ci/gui-failures/
            outputs/ci/coverage/
            outputs/ci/usage-runs/**/run.log
            outputs/ci/usage-runs/**/report.json
            outputs/ci/usage-runs/**/fast-configs/**
