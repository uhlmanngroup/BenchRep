# Temporary diagnostic run. Revert this patch after investigating macOS 08A.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: macos-15 / Python 3.12 / diagnose 08A
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      COVERAGE_RCFILE: ${{ github.workspace }}/outputs/ci/coverage/coverage.ini

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Graphviz and OpenMP
        run: brew install graphviz libomp

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch
        run: python -m pip install "torch==2.15.0" "torchvision==0.29.2"

      - name: Install BenchRep with dev deps
        id: install
        run: |
          # Match the numerical stack recorded in the failed macOS/Python 3.12 job.
          # These are temporary diagnostic pins, not changes to supported ranges.
          python -m pip install -e ".[dev]" "coverage>=7.11,<8" \
            "torch==2.15.0" "torchvision==0.29.2" "lightning==2.6.6" \
            "numpy==2.5.5" "scipy==1.18.1" "scikit-learn==1.9.1" \
            "scanpy==1.12.6" "numba==0.68.1" "umap-learn==0.6.0" "xgboost==3.4.1"
          mkdir -p outputs/ci
          python -VV > outputs/ci/environment.txt
          python -m pip list --format=freeze >> outputs/ci/environment.txt
          sw_vers >> outputs/ci/environment.txt
          uname -m >> outputs/ci/environment.txt
          brew list --versions graphviz libomp >> outputs/ci/environment.txt
          dot -V 2>> outputs/ci/environment.txt
          python -m pip check

      - name: Restore MNIST downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: data/mnist/
          key: macOS-08A-mnist-v1

      - name: Configure coverage
        id: coverage
        shell: python
        run: |
          import os
          from pathlib import Path

          root = Path.cwd()
          coverage_dir = root / "outputs" / "ci" / "coverage"
          coverage_dir.mkdir(parents=True, exist_ok=True)
          Path(os.environ["COVERAGE_RCFILE"]).write_text(
              "[run]\n"
              f"source = {(root / 'src' / 'benchrep').as_posix()}\n"
              "branch = true\n"
              "parallel = true\n"
              "patch = subprocess\n"
              "concurrency = multiprocessing\n"
              f"data_file = {(coverage_dir / '.coverage').as_posix()}\n",
              encoding="utf-8",
          )

      - name: Check standalone XGBoost in a fresh process
        id: standalone
        timeout-minutes: 4
        run: |
          python tests/usage/ci_diagnostics.py standalone outputs/ci/diagnostics/standalone \
            2>&1 | tee outputs/ci/standalone.log

      - name: Diagnose usage example 08A on CPU
        id: tests
        # Still run after a standalone failure, without making either failure green.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.coverage.outcome == 'success' }}
        timeout-minutes: 20
        env:
          BENCHREP_CI_DIAGNOSTICS: ${{ github.workspace }}/outputs/ci/diagnostics
        run: |
          python -m coverage run -m pytest tests/usage/test_examples.py \
            --run-usage-examples --usage-include 08A --usage-device cpu \
            --usage-output outputs/ci/usage-runs --no-usage-clean-on-success \
            --usage-timeout 900 --junitxml=outputs/ci/pytest.xml \
            --durations=15 -ra -v

      - name: Save MNIST downloads even after a test failure
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') && steps.downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: data/mnist/
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Generate coverage reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          python -m coverage combine --keep
          python -m coverage report --show-missing | tee outputs/ci/coverage/summary.txt
          python -m coverage json -o outputs/ci/coverage/coverage.json
          python -m coverage xml -o outputs/ci/coverage/coverage.xml
          python -m coverage html -d outputs/ci/coverage/html

      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-15-py3.12-08A-diagnostics
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            outputs/ci/environment.txt
            outputs/ci/standalone.log
            outputs/ci/pytest.xml
            outputs/ci/diagnostics/
            outputs/ci/coverage/
            outputs/ci/usage-runs/**/run.log
            outputs/ci/usage-runs/**/report.json
            outputs/ci/usage-runs/**/fast-configs/**
            outputs/ci/usage-runs/**/records/logs/*.log
            outputs/ci/usage-runs/**/records/metadata/*.yaml
