name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.12", "3.13", "3.14"]
    timeout-minutes: 60

    # Git Bash is available on the Windows runner too.
    defaults:
      run:
        shell: bash

    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      COVERAGE_RCFILE: ${{ github.workspace }}/outputs/ci/coverage/coverage.ini

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Graphviz on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Graphviz and OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install graphviz libomp

      - name: Install Graphviz on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install graphviz --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $graphvizBin = Join-Path $env:ProgramFiles 'Graphviz\bin'
          if (-not (Test-Path (Join-Path $graphvizBin 'dot.exe'))) {
            throw "Graphviz executable not found in $graphvizBin"
          }
          $graphvizBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: |
          python -m pip install "torch>=2.3,<3" "torchvision>=0.18,<1" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.3,<3" "torchvision>=0.18,<1"

      - name: Install BenchRep and test dependencies
        run: |
          python -m pip install \
            -e ".[test,gui-test,docs,scverse,optuna,model_graph,artifact_generation,xgboost]" \
            "coverage>=7.11,<8"
          mkdir -p outputs/ci
          python -VV > outputs/ci/environment.txt
          python -m pip list --format=freeze >> outputs/ci/environment.txt
          python -m pip check

      - name: Install Chromium for wizard tests
        run: python -m playwright install --with-deps chromium

      # Downloaded inputs can be shared by all Python versions on the same OS.
      - name: Restore datasets and pretrained weights
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            data/
            ~/.cache/torch/hub/checkpoints/
          key: ${{ runner.os }}-usage-downloads-v1-${{ hashFiles('src/benchrep/examples/configs/**', 'src/benchrep/examples/usage/*.py', 'tests/usage/runner.py') }}
          restore-keys: |
            ${{ runner.os }}-usage-downloads-v1-

      - name: Configure coverage
        shell: python
        run: |
          import os
          from pathlib import Path

          root = Path.cwd()
          coverage_dir = root / "outputs" / "ci" / "coverage"
          coverage_dir.mkdir(parents=True, exist_ok=True)
          Path(os.environ["COVERAGE_RCFILE"]).write_text(
              "[run]\n"
              f"source = {(root / 'src' / 'benchrep').as_posix()}\n"
              "branch = true\n"
              "parallel = true\n"
              "patch = subprocess\n"
              "concurrency = multiprocessing\n"
              f"data_file = {(coverage_dir / '.coverage').as_posix()}\n",
              encoding="utf-8",
          )

      - name: Run the full suite, including usage examples
        id: tests
        run: |
          python -m coverage run -m pytest tests/*/ \
            --run-usage-examples \
            --usage-device cpu \
            --usage-output outputs/ci/usage-runs \
            --junitxml=outputs/ci/pytest.xml \
            --durations=15 -ra

      # Keep downloads even when a test fails; do not cache generated test outputs.
      - name: Save datasets and pretrained weights
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') && steps.downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/
            ~/.cache/torch/hub/checkpoints/
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Generate coverage reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          python -m coverage combine --keep
          python -m coverage report --show-missing | tee outputs/ci/coverage/summary.txt
          python -m coverage json -o outputs/ci/coverage/coverage.json
          python -m coverage xml -o outputs/ci/coverage/coverage.xml
          python -m coverage html -d outputs/ci/coverage/html

      - name: Save reports and usage failure logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            outputs/ci/environment.txt
            outputs/ci/pytest.xml
            outputs/ci/coverage/
            outputs/ci/usage-runs/**/run.log
            outputs/ci/usage-runs/**/report.json
            outputs/ci/usage-runs/**/fast-configs/**
