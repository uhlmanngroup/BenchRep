site_name: BenchRep
site_description: Representation learning and benchmarking
repo_url: https://github.com/uhlmanngroup/BenchRep
repo_name: uhlmanngroup/BenchRep
edit_uri: edit/main/docs/
extra_css:
- stylesheets/extra.css
- stylesheets/reference.css
- stylesheets/appearance.css
- stylesheets/home.css
- stylesheets/schemas.css
- stylesheets/reference-navigation.css
- stylesheets/codebase-map.css
extra_javascript:
- javascripts/reference-navigation.js
theme:
  name: material
  variant: classic
  logo: assets/logo.svg
  font:
    text: Instrument Sans
    code: Roboto Mono
  palette:
  - scheme: default
    primary: deep purple
    accent: purple
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: deep purple
    accent: purple
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.indexes
  - navigation.footer
  - content.code.copy
  - content.action.view
  icon:
    view: fontawesome/solid/code
nav:
- Home: index.md
- Tutorials:
  - guides/index.md
  - Getting started:
    - guides/getting-started/index.md
    - Installation: guides/installation.md
    - Known issues: known-issues.md
    - Run your first workflow chain: guides/first-workflow-chain.md
  - Configure workflows: guides/configure-workflows/index.md
  - Register external components: guides/register-components.md
  - Build a composite model: guides/multitask-composite.md
  - Learn from multiple views: guides/learn-from-multiple-views.md
  - Schedule and monitor training: guides/schedule-and-monitor-training.md
  - Bring your own model or datamodule: guides/bring-your-own-model-or-datamodule.md
  - Evaluate external outputs: guides/standalone-evaluation.md
  - Tune with Optuna: guides/optuna.md
  - Trace an evaluation result: guides/trace-an-evaluation-result.md
- Concepts & design:
  - concepts/index.md
  - Workflows & configuration:
    - concepts/workflows/index.md
    - Workflows and model families: concepts/workflows/workflows.md
    - Configuration semantics: concepts/workflows/configuration.md
    - Python overrides: concepts/workflows/overrides.md
    - Configuration wizards: concepts/workflows/wizards.md
    - Workflow implementation: concepts/workflows/workflow-anatomy.md
    - Wizard implementation: concepts/workflows/wizard-architecture.md
  - Data:
    - concepts/data/index.md
    - Datasets and sample structure: concepts/data/datasets.md
    - Transform pipelines: concepts/data/transforms.md
    - Splits and dataloaders: concepts/data/datamodules.md
  - Models & objectives:
    - concepts/models/index.md
    - Canonical models: concepts/models/canonical.md
    - Composite models: concepts/models/composite.md
    - Architecture component contracts: concepts/models/component-contracts.md
    - Losses and objectives: concepts/models/losses.md
    - Loss-weight schedules: concepts/models/loss-weight-schedules.md
  - Training:
    - concepts/training/index.md
    - Training and optimization: concepts/training/optimization.md
    - Callbacks and checkpoints: concepts/training/callbacks.md
    - Monitoring and inspection: concepts/training/inspection.md
  - Prediction:
    - concepts/prediction/index.md
    - Loading models for prediction: concepts/prediction/loading-models.md
    - Selecting prediction exports: concepts/prediction/exports.md
  - Evaluation:
    - concepts/evaluation/index.md
    - Inputs and evaluation pipelines: concepts/evaluation/inputs.md
    - Reductions and clustering: concepts/evaluation/reductions-clustering.md
    - Metrics and their contracts: concepts/evaluation/metrics.md
    - Predictability probes: concepts/evaluation/predictability.md
    - Reconstruction evaluation: concepts/evaluation/reconstructions.md
    - Figures and visualization: concepts/evaluation/figures.md
  - Results & provenance:
    - concepts/results/index.md
    - Run directories and result objects: concepts/results/runs.md
    - Artifact formats: concepts/results/artifacts.md
    - Manifests and provenance: concepts/results/provenance.md
    - Reproducibility: concepts/results/reproducibility.md
    - Statuses and failures: concepts/results/statuses.md
  - Extensibility:
    - concepts/extensibility/index.md
    - Registries and discovery: concepts/extensibility/discovery.md
    - Registering components: concepts/extensibility/registration.md
    - External models and datamodules: concepts/extensibility/runtime-implementations.md
  - Codebase map: concepts/codebase-map.md
- Reference:
  - reference/index.md
  - Workflow entrypoints: reference/workflows.md
  - Overrides and config helpers: reference/configuration.md
  - Configuration schemas:
    - reference/schemas/index.md
    - Training: reference/schemas/training.md
    - Prediction: reference/schemas/prediction.md
    - Evaluation: reference/schemas/evaluation.md
    - Shared and composite schemas: reference/schemas/shared.md
  - Configuration wizards: reference/wizards.md
  - Results and statuses: reference/results.md
  - Registries and discovery: reference/registries.md
  - Extension interfaces: reference/interfaces.md
  - Component catalogue:
    - reference/components.md
    - Models: reference/components/models.md
    - Encoders, decoders, and heads: reference/components/architectures.md
    - Datasets: reference/components/datasets.md
    - Losses: reference/components/losses.md
    - Loss-weight schedules: reference/components/schedules.md
  - Example and artifact helpers: reference/helpers.md
markdown_extensions:
- toc:
    permalink: true
- admonition
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.emoji:
    emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
    emoji_index: !!python/name:zensical.extensions.emoji.twemoji
- attr_list
plugins:
  - mkdocstrings:
      custom_templates: docs_support/templates
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - docs_support/extensions/schema_reference.py
              - docs_support/extensions/public_reference.py
            allow_inspection: false
            docstring_style: numpy
            members: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 72
            merge_init_into_class: true
            show_source: false
            docstring_section_style: list
            extra:
              source_base_url: https://github.com/uhlmanngroup/BenchRep/blob/main