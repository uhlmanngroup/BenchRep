extra:
  logo_dark: assets/logo-dark.svg
markdown_extensions:
- toc:
    permalink: true
- admonition
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences
plugins:
  - mkdocstrings:
      custom_templates: docs_templates
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - docs_extensions/schema_reference.py
              - docs_extensions/public_reference.py
            allow_inspection: false
            docstring_style: numpy
            members: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 72
            merge_init_into_class: true
            show_source: false
            docstring_section_style: list
            extra:
              source_base_url: https://github.com/uhlmanngroup/BenchRep/blob/main