site_name: BenchRep
site_description: Representation learning and benchmarking
repo_url: https://github.com/uhlmanngroup/BenchRep
repo_name: uhlmanngroup/BenchRep
edit_uri: edit/main/docs/
extra_css:
- stylesheets/extra.css
- stylesheets/reference.css
- stylesheets/appearance.css
- stylesheets/home.css
- stylesheets/schemas.css
theme:
  name: material
  variant: classic
  custom_dir: docs_overrides
  logo: assets/logo-light.svg
  font:
    text: Instrument Sans
    code: Roboto Mono
  palette:
  - scheme: default
    primary: deep purple
    accent: purple
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: deep purple
    accent: purple
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.indexes
  - navigation.footer
  - content.code.copy
  - content.action.view
  icon:
    view: fontawesome/solid/code
