stage: prediction

source:
  training_manifest_path: null
  checkpoint: best

dataset:
  name: mnist
  params:
    root: examples/data/mnist
    split: test
    download: true

# Inherit the validation transforms recorded during training.
transform_pipelines: null

data:
  batch_size: null
  num_workers: null
  max_batches: null

inference:
  seed: null
  seed_workers: null
  deterministic: null
  float32_matmul_precision: null
  reconstruction_latent_source: mean

exports:
  anndata:
    enabled: true
    mode: custom
    keys:
      - embedding
    primary_key: embedding

  reconstructions:
    enabled: true
    mode: all
    pairs: null
    n_examples: 32
    selection: random
    stratify_by: label
    seed: null
    include_input: true
    include_reconstruction: true