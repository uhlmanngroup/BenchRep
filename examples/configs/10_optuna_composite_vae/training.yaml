stage: training
run:
  output_root: outputs
  run_name_prefix: 10_optuna_composite_vae
reproducibility:
  seed: 137
  seed_workers: true
  float32_matmul_precision: highest
dataset:
  name: mnist
  params:
    root: data/mnist
    split: train
    download: true
transform_pipelines:
  - steps:
      - name: to_dtype
        apply_to: [training, validation]
        params:
          dtype: float32
          scale: true
datamodule:
  batch_size: 128
  val_fraction: 0.1
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  drop_last: false
model:
  name: composite
composite_model_declarations:
  expects:
    x: sample_image
  batch_metadata:
    sample_id: index
    label: group
  produces:
    encoder_features: projection_vector
    z_sample: embedding_vector
    z_mu: embedding_vector
    z_logvar: continuous_auxiliary_vector
    reconstruction: reconstruction_image
composite_model_components:
  image_encoder:
    kind: encoder
    name: mlp
    params:
      input_shape: [1, 28, 28]
      output_dim: 64
      hidden_dims: [128]
  variational_head:
    kind: head
    name: gaussian_variational
    params:
      in_features: 64
      latent_dim: 16
  image_decoder:
    kind: decoder
    name: mlp
    params:
      input_dim: 16
      output_shape: [1, 28, 28]
      hidden_dims: [128]
      output_activation: sigmoid
composite_model_assembly:
  encode:
    component: image_encoder
    inputs:
      x: expects.x
    outputs: produces.encoder_features
  parameterize:
    component: variational_head
    inputs:
      x: produces.encoder_features
    outputs:
      z_sample: produces.z_sample
      z_mu: produces.z_mu
      z_logvar: produces.z_logvar
  reconstruct:
    component: image_decoder
    inputs:
      z: produces.z_sample
    outputs: produces.reconstruction
losses:
  reconstruction:
    - name: mse
      weight: 1.0
      params:
        reduction: mean
      composite_wiring:
        reconstruction: produces.reconstruction
        target: expects.x
  regularization:
    - name: gaussian_kld
      weight: 0.001
      params:
        reduction: mean
      composite_wiring:
        z_mu: produces.z_mu
        z_logvar: produces.z_logvar
optimizer:
  name: adam
  params:
    lr: 0.001
trainer:
  max_epochs: 10
  accelerator: auto
  devices: 1
  deterministic: true
  benchmark: false
  precision: 32-true
  log_every_n_steps: 10
  enable_progress_bar: false
  enable_model_summary: false
logger: null
# Fix checkpoint selection across trials even though beta changes.
checkpointing:
  monitor: losses/val/reconstruction/mse
  mode: min
  save_top_k: 1
  save_last: true
early_stopping: null
additional_callbacks: []
