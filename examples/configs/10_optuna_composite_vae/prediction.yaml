stage: prediction

source:
  training_manifest_path: null
  checkpoint: best

# The script supplies the training validation subset through
# PredictionOverrides.datamodule, including its transforms and loader settings.
overrides:
  datamodule: {}

inference:
  seed: 137
  seed_workers: true
  deterministic: true
  float32_matmul_precision: highest
  composite_model_assembly_input_overrides:
    reconstruct:
      inputs:
        z: produces.z_mu

exports:
  anndata:
    enabled: true
    mode: custom
    keys: [z_mu]
    primary_key: z_mu
  reconstructions:
    enabled: false