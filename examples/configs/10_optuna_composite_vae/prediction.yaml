stage: prediction
source:
  training_manifest_path: null
  checkpoint: best
# The example supplies the already transformed training validation subset
# through PredictionOverrides.datamodule. Null to inherit without duplicating transforms.
dataset: null
transform_pipelines: []
data:
  batch_size: 128
  num_workers: 0
  max_batches: null
inference:
  seed: 137
  seed_workers: true
  deterministic: true
  float32_matmul_precision: highest
  composite_model_assembly_input_overrides:
    reconstruct:
      inputs:
        z: produces.z_mu
exports:
  anndata:
    enabled: true
    mode: custom
    keys: [z_mu]
    primary_key: z_mu
  reconstructions:
    enabled: false
