stage: prediction

source:
  training_manifest_path: null
  checkpoint: best              # best | last | checkpoint filename in training checkpoint dir

dataset:
  name: stl10
  params:
    root: examples/data/stl10
    split: test
    download: true

# null/omitted = inherit training preprocessing
# explicit list = replace inherited transforms
# [] = apply no configured transforms
transform_pipelines: null

data:
  batch_size: null              # null = reuse training setting
  num_workers: null             # null = reuse training setting
  max_batches: null             # null = all batches; int = diagnostic subset

inference:
  seed: null                    # null = reuse training seed
  seed_workers: null            # null = reuse training setting
  deterministic: null           # deterministic algs (Trainer param)
  float32_matmul_precision: null # null = reuse training setting

exports:
  anndata:
    enabled: true
    mode: all
    keys: null
    primary_key: null

  reconstructions:
    enabled: true
    mode: all
    pairs: null
    n_examples: 32
    selection: random
    stratify_by: label
    seed: null
    include_input: true
    include_reconstruction: true