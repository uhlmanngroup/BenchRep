stage: prediction

source:
  training_manifest_path: null
  checkpoint: best

dataset:
  name: enriched_mnist
  params:
    root: examples/data/mnist
    split: test
    download: true

# Inherit the validation transform recorded during training
transform_pipelines: null

data:
  batch_size: 512
  num_workers: 4
  max_batches: null

inference:
  seed: null
  seed_workers: null
  deterministic: null
  float32_matmul_precision: null
  canonical_vae_reconstruction_latent_source: null

exports:
  anndata:
    enabled: true
    mode: custom
    keys:
      - embedding
    primary_key: embedding

  reconstructions:
    enabled: true
    mode: all
    pairs: null
    n_examples: 500
    selection: random
    stratify_by: digit_label
    seed: 137
    include_input: true
    include_reconstruction: true