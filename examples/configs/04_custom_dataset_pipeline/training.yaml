stage: training

run:
  output_root: outputs
  project_name: 04_custom_dataset_pipeline

reproducibility:
  seed: 137
  seed_workers: true
  float32_matmul_precision: highest

model:
  name: vae
  params:
    latent_dim: 32

encoder:
  name: conv2d
  params:
    input_shape: [1, 28, 28]
    output_dim: 32
    channels: [32, 64]
    kernel_size: 3
    stride: 2
    padding: 1
    normalization: batchnorm

decoder:
  name: upsample_conv2d
  params:
    output_shape: [1, 28, 28]
    channels: [32, 16]
    normalization: batchnorm
    output_activation: sigmoid

losses:
  reconstruction:
    mse:
      weight: 0.8
      params:
        reduction: mean
    mae:
      weight: 0.2
      params:
        reduction: mean
  regularization:
    gaussian_kld:
      weight: 0.0001
      params:
        reduction: mean

optimizer:
  name: adam
  params:
    lr: 0.001

dataset:
  name: fashion_mnist
  params:
    root: examples/data/fashion_mnist
    split: train
    download: true

transforms:
  - name: to_dtype
    category: preprocessing
    params:
      dtype: float32
      scale: true

datamodule:
  batch_size: 128
  val_fraction: 0.1
  num_workers: 4
  pin_memory: auto
  persistent_workers: true
  drop_last: false

trainer:
  max_epochs: 5
  accelerator: auto
  devices: auto
  log_every_n_steps: 20
  deterministic: true
  benchmark: false
  precision: 32-true

logger: null

checkpointing:
  monitor: val/loss
  mode: min
  save_top_k: 1
  save_last: true

inspection:
  torchview:
    enabled: false